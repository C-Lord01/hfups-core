[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "hfups"
version = "0.1.0"
description = "HFUPS protocol core"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Chris Kulpa" }
]

dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
nova = ["boto3>=1.34"]
huggingface = ["requests>=2.28"]

[project.scripts]
hfups-demo = "hfups.cli_demo:main"
hfups-rx = "hfups.cli_rx:main"
hfups-tx = "hfups.cli_tx:main"
hfups-demo-run = "hfups.demo.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfups"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
