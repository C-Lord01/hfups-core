[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "hfups"
version = "0.1.0"
description = "HFUPS protocol core"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HFUPS Team" }
]

[project.scripts]
hfups-demo = "hfups.cli_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfups"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
